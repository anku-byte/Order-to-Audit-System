<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login – SnackAudit</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-blue-50 flex items-center justify-center">
<div class="bg-white shadow-lg rounded-xl p-8 w-full max-w-sm">
  <h1 class="text-2xl font-bold text-blue-800 mb-2">🏭 SnackAudit</h1>
  <p class="text-gray-500 text-sm mb-6">Order-to-Audit System</p>

  {% if form.errors %}
  <div class="bg-red-100 text-red-700 p-3 rounded mb-4 text-sm">Invalid credentials. Try again.</div>
  {% endif %}

  <form method="post">
    {% csrf_token %}
    <div class="mb-4">
      <label class="block text-sm font-medium mb-1">Username</label>
      <input name="username" type="text" autofocus required
             class="w-full border rounded px-3 py-2 focus:ring-2 focus:ring-blue-500 outline-none">
    </div>
    <div class="mb-6">
      <label class="block text-sm font-medium mb-1">Password</label>
      <input name="password" type="password" required
             class="w-full border rounded px-3 py-2 focus:ring-2 focus:ring-blue-500 outline-none">
    </div>
    <button type="submit"
            class="w-full bg-blue-700 hover:bg-blue-800 text-white font-semibold py-2 rounded">
      Sign In
    </button>
  </form>
  <p class="text-xs text-gray-400 mt-6 text-center">
    Test logins: admin_user/admin123 · salesman_a/pass123 · production/pass123 · accountant/pass123 · owner/pass123
  </p>
</div>
</body>
</html>
