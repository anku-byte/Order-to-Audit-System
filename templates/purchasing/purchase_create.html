{% extends "base.html" %}
{% block title %}New Purchase{% endblock %}
{% block content %}
<div class="max-w-3xl mx-auto">
<div class="mb-6">
  <a href="{% url 'purchase_list' %}" class="text-blue-600 text-sm hover:underline">← Purchases</a>
  <h1 class="text-2xl font-bold mt-1">Record Raw Material / Packaging Purchase</h1>
</div>

<form method="post" class="bg-white rounded-lg shadow p-6 space-y-4">
  {% csrf_token %}
  <div class="grid grid-cols-3 gap-4">
    <div>
      <label class="block text-xs font-semibold uppercase text-gray-600 mb-1">Supplier</label>
      <select name="supplier" required class="w-full border rounded px-3 py-2 text-sm">
        <option value="">Select Supplier…</option>
        {% for s in suppliers %}
        <option value="{{ s.id }}">{{ s.name }} ({{ s.state_code }})</option>
        {% endfor %}
      </select>
    </div>
    <div>
      <label class="block text-xs font-semibold uppercase text-gray-600 mb-1">Purchase Date</label>
      <input type="date" name="purchase_date" required value="{% now 'Y-m-d' %}"
             class="w-full border rounded px-3 py-2 text-sm">
    </div>
    <div>
      <label class="block text-xs font-semibold uppercase text-gray-600 mb-1">Vendor Invoice #</label>
      <input type="text" name="invoice_ref" placeholder="Supplier Bill Ref"
             class="w-full border rounded px-3 py-2 text-sm">
    </div>
  </div>

  <div id="lines_container" class="pt-4 border-t">
    <h3 class="font-bold text-gray-800 text-sm mb-3">Line Items</h3>
    <div class="space-y-3" id="purchase_lines">
      <div class="purchase-line-row flex gap-2 items-center bg-gray-50 p-3 rounded border">
        <select name="item_id" required class="flex-2 border rounded px-2 py-1.5 text-sm bg-white">
          <option value="">Select Raw / Packaging Item…</option>
          {% for item in items %}
          <option value="{{ item.id }}">{{ item.name }} ({{ item.base_unit }})</option>
          {% endfor %}
        </select>
        <input type="number" step="0.001" name="qty" placeholder="Qty" required
               class="w-24 border rounded px-2 py-1.5 text-sm font-mono">
        <input type="text" name="unit" placeholder="Unit (kg/L/piece)" required
               class="w-24 border rounded px-2 py-1.5 text-sm">
        <input type="number" name="unit_price_paise" placeholder="Rate (paise)" required
               class="w-32 border rounded px-2 py-1.5 text-sm font-mono">
        <span class="text-xs text-gray-400">paise/unit</span>
      </div>
    </div>
    <button type="button" onclick="addPurchaseLine()" class="mt-2 text-xs font-semibold text-blue-600 hover:underline">
      + Add Another Item
    </button>
  </div>

  <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 rounded mt-6 text-sm">
    Save Purchase (Draft)
  </button>
</form>
</div>

<script>
function addPurchaseLine() {
  const container = document.getElementById('purchase_lines');
  const tpl = container.querySelector('.purchase-line-row').cloneNode(true);
  tpl.querySelectorAll('input').forEach(i => i.value = '');
  container.appendChild(tpl);
}
</script>
{% endblock %}
